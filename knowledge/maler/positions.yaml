# Maler-Positionsbibliothek v0 (Innenrenovierung). Strukturierte Positionstypen,
# kein Prompt-Text. "nicht_enthalten" listet Leistungen, die NIE automatisch als
# enthalten angenommen werden dürfen (Brief §1.4). "preisquellen" sind die einzig
# zulässigen Quellen für einen Preis; sonst bleibt das Preisfeld leer.
# ERSTER ENTWURF aus dem Briefing — von Malermeistern zu validieren.

positionen:
  - position_id: baustelle_einrichten
    kategorie: vorbereitung
    titel: Baustelle einrichten
    beschreibung: Arbeitsplatz einrichten, Material und Geräte bereitstellen.
    einheiten: [pauschal]
    preisquellen: [explicit_current_input, confirmed_private_historical_offer, manual_current_editor_input]

